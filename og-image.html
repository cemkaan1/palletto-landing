<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Palletto OG Image</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: #2a2a2a;
      min-height: 100vh;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    
    /* Download Button */
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      background: rgba(255,255,255,0.05);
      padding: 16px 24px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .controls span {
      color: rgba(255,255,255,0.6);
      font-size: 14px;
    }
    
    .download-btn {
      background: #FF9500;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    
    .download-btn:hover { background: #e88500; }
    .download-btn:active { transform: scale(0.97); }
    
    /* OG Image - FIXED 1200x630 */
    .og-container {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #1B3A6B 0%, #142b50 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px;
      flex-shrink: 0;
    }
    
    .circle-1 {
      position: absolute;
      top: -200px;
      right: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255,149,0,0.3) 0%, transparent 70%);
      border-radius: 50%;
    }
    
    .circle-2 {
      position: absolute;
      bottom: -150px;
      left: -150px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(255,149,0,0.15) 0%, transparent 70%);
      border-radius: 50%;
    }
    
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    
    .content {
      position: relative;
      z-index: 10;
      max-width: 900px;
    }
    
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 149, 0, 0.15);
      color: #FF9500;
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 149, 0, 0.3);
    }
    
    .badge-dot {
      width: 8px;
      height: 8px;
      background: #FF9500;
      border-radius: 50%;
    }
    
    .headline {
      font-size: 72px;
      font-weight: 900;
      color: white;
      line-height: 1.05;
      letter-spacing: -2px;
      margin: 0 0 24px 0;
    }
    
    .headline-accent { color: #FF9500; }
    
    .subline {
      font-size: 24px;
      color: rgba(255, 255, 255, 0.75);
      line-height: 1.4;
      margin: 0 0 36px 0;
      max-width: 850px;
      font-weight: 400;
    }
    
    .features-row {
      display: flex;
      gap: 28px;
      align-items: center;
    }
    
    .feature {
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 18px;
      font-weight: 600;
    }
    
    .check {
      width: 26px;
      height: 26px;
      background: rgba(255, 149, 0, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FF9500;
      font-size: 14px;
      font-weight: 900;
    }
    
    .url-tag {
      position: absolute;
      bottom: 60px;
      right: 80px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 14px 28px;
      border-radius: 100px;
      color: white;
      font-size: 20px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 10;
    }
    
    .flag {
      position: absolute;
      top: 60px;
      right: 80px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 16px;
      font-weight: 600;
      z-index: 10;
    }
    
    .flag-emoji { font-size: 24px; }
  </style>
</head>
<body>
  
  <div class="controls">
    <span>1200×630 — Bereit zum Download</span>
    <button class="download-btn" onclick="downloadImage()">⬇ Download PNG</button>
  </div>
  
  <div class="og-container" id="og">
    <div class="circle-1"></div>
    <div class="circle-2"></div>
    <div class="grid-overlay"></div>
    
    <div class="flag">
      <span class="flag-emoji">🇩🇪</span>
      <span>Made in Germany</span>
    </div>
    
    <div class="content">
      <div class="badge">
        <span class="badge-dot"></span>
        Palettenkonto Software für Transportunternehmen
      </div>
      
      <h1 class="headline">
        Eure Paletten.<br>
        <span class="headline-accent">Digital. Einfach.</span>
      </h1>
      
      <p class="subline">
        Digitale Palettenscheine mit Unterschrift.<br>
        Rechtssicher nach §126b BGB. DSGVO-konform.
      </p>
      
      <div class="features-row">
        <div class="feature">
          <span class="check">✓</span>
          <span>§126b BGB</span>
        </div>
        <div class="feature">
          <span class="check">✓</span>
          <span>DSGVO-konform</span>
        </div>
        <div class="feature">
          <span class="check">✓</span>
          <span>30 Tage gratis</span>
        </div>
      </div>
    </div>
    
    <div class="url-tag">palletto.de</div>
  </div>

  <script>
    function downloadImage() {
      const btn = document.querySelector('.download-btn');
      const originalText = btn.textContent;
      btn.textContent = '⏳ Generiere...';
      btn.disabled = true;
      
      const element = document.getElementById('og');
      
      html2canvas(element, {
        width: 1200,
        height: 630,
        scale: 2, // Retina-quality
        backgroundColor: null,
        logging: false,
        useCORS: true
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'og-image.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        
        btn.textContent = '✅ Heruntergeladen!';
        setTimeout(() => {
          btn.textContent = originalText;
          btn.disabled = false;
        }, 2000);
      }).catch(err => {
        console.error(err);
        btn.textContent = '❌ Fehler';
        setTimeout(() => {
          btn.textContent = originalText;
          btn.disabled = false;
        }, 2000);
      });
    }
  </script>
</body>
</html>
